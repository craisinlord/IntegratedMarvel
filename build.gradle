plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = maven_group
version = "${mod_version}+${minecraft_version}"

base {
    archivesName = "${mod_id}-neoforge"
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://jitpack.io' }
}

neoForge {
    version = neoforge_version
    mods {
        create(mod_id) {
            sourceSet sourceSets.main
        }
    }
    runs {
        client { client() }
        server { server() }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        version        : project.version,
        mod_id         : mod_id,
        mod_name       : mod_name,
        mod_description: mod_description,
        mod_authors    : mod_authors,
        mod_license    : mod_license
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: '*.jar')
    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.3"))
    jarJar(implementation("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:0.3.3"))
    localRuntime fileTree(dir: 'libs/runtime', include: '*.jar')
}
