plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = maven_group
version = "${mod_version}+${minecraft_version}"

base {
    archivesName = "${mod_id}-neoforge"
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://jitpack.io' }
}

neoForge {
    version = neoforge_version
    mods {
        create(mod_id) {
            sourceSet sourceSets.main
        }
    }
    runs {
        client { client() }
        server { server() }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        version        : project.version,
        mod_id         : mod_id,
        mod_name       : mod_name,
        mod_description: mod_description,
        mod_authors    : mod_authors,
        mod_license    : mod_license
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: '*.jar')
    compileOnly files('anthology_jars/anthology-1.0.0+1.21.1-neoforge.jar')
    localRuntime files('anthology_jars/anthology-1.0.0+1.21.1-neoforge.jar')
    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.3"))
    jarJar(implementation("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:0.3.3"))
    localRuntime fileTree(dir: 'libs/runtime', include: '*.jar')
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath

tasks.register('verifyDoom', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.output + sourceSets.main.output + sourceSets.main.compileClasspath
    mainClass = 'com.craisinlord.integrated_superheroes.compat.thematic.DoomVerification'
}

tasks.register('verifyEndgameSuits', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.output + sourceSets.main.output + sourceSets.main.compileClasspath
    mainClass = 'com.craisinlord.integrated_superheroes.compat.thematic.EndgameSuitVerification'
}

tasks.register('verifyPowerOwnership', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.output + sourceSets.main.output + sourceSets.main.compileClasspath
    mainClass = 'com.craisinlord.integrated_superheroes.compat.thematic.PowerOwnershipVerification'
    args 'C:/Users/maxlo/Desktop/modding/Boogloo Core fr/neoforge/src/main/resources/data/boogaloo_core/thematic_suit_bands.json'
}
